services:
  backend:
    container_name: plenna-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
      - "9229:9229"
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=system
      - JWT_SECRET=samantinha
    depends_on:
      - db
    networks:
      - backend-network
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules

  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: system
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mysql-data:
  backend_node_modules:
